<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Corridor</title>
<style>
  html, body { margin: 0; height: 100%; background: #050403; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 4, 3, 0.6); color: #e9e2d3; text-align: center; cursor: pointer; user-select: none; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-weight: 500; letter-spacing: 0.08em; margin: 0 0 0.6em; font-size: 22px; }
  #overlay p { margin: 0.35em 0; font-size: 14px; opacity: 0.85; }
  #status { opacity: 0.6; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="overlay"><div>
  <h1>HOTEL CORRIDOR</h1>
  <p>Click to walk</p>
  <p>W A S D move &middot; mouse look &middot; Shift walk faster &middot; Esc release mouse</p>
  <p id="status">Loading&hellip;</p>
</div></div>

<script type="module">
import * as THREE from 'three';

// ============================================================================
// PARAMETERS  (metres, unless noted)
// ============================================================================
const P = {
  // layout
  width: 2.4,              // corridor width
  height: 2.7,             // ceiling height
  segLen: 12,              // repeating unit: 2 doors per side + 3 ceiling fixtures
  doorPitch: 6,            // spacing between doors on the same side; sides are staggered by half
  doorW: 0.95, doorH: 2.13,
  recess: 0.15,            // how deep each doorway sits into the wall
  casingW: 0.075, casingT: 0.018,
  baseH: 0.12, baseT: 0.014,
  crownH: 0.095, crownP: 0.085,
  plateW: 0.15, plateH: 0.075, plateY: 1.55,
  knobY: 0.98,
  fixtureSpacing: 4, fixtureOffset: 2,   // fixtures sit at z = offset + n * spacing
  fixtureW: 0.30, fixtureL: 0.60, fixtureRim: 0.035,

  // surfaces
  carpetRepeat: 0.80,      // metres covered by one carpet tile (smaller = smaller pattern)
  wallRepeat: 0.70,        // metres covered by one wallpaper tile
  // Neither supplied image tiles perfectly. 'mirror' = mirrored repeat (no seams, symmetric look),
  // 'blend' = cross-fade a thin band at the edges (keeps the original look, best for soft patterns), 'off' = plain repeat.
  carpetSeamFix: 'mirror',
  wallSeamFix: 'blend',
  edgeDark: 0.42,          // how much darker the carpet gets right at the wall (0 = none)
  edgeWidth: 0.38,         // how far from the wall the carpet darkening reaches

  // light
  fixtureIntensity: 7.0,
  fixtureFocus: 3.5,       // higher = tighter pools of light, darker gaps
  fixtureColor: 0xffd7a3,
  diffuserGlow: 2.2,       // brightness of the fixture panel itself
  ceilingGlow: 0.35,       // faint halo each fixture throws on the ceiling around it
  bounce: 0.55,            // soft fill that follows the fixtures
  ambient: 0.05,
  exposure: 1.2,

  // fog (always the same distance from the camera)
  fogNear: 7, fogFar: 40, fogColor: 0x050403,

  // camera
  eye: 1.6, fov: 65,
  walkSpeed: 1.4, fastSpeed: 2.8, mouseSens: 0.0022,
};

// Seven named doors, in order, starting at the first door ahead of the spawn point.
const NAMED_DOORS = [22, 1930, 1944, 127, 1031, 9, 10];

const HALF = P.width / 2;
const statusEl = document.getElementById('status');

// ============================================================================
// SMALL HELPERS
// ============================================================================
function hash32(n) {
  let x = (n | 0) ^ 0x9e3779b9;
  x = Math.imul(x ^ (x >>> 16), 0x85ebca6b);
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}

function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}

function imageData(img) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
  return g.getImageData(0, 0, c.width, c.height);
}

// Compare the wrap-around edge to ordinary neighbouring columns/rows. A ratio well above 1 means a visible seam.
function seamRatio(id) {
  const { width: w, height: h, data: d } = id;
  const px = (x, y, k) => d[(y * w + x) * 4 + k];
  let edgeX = 0, inX = 0, edgeY = 0, inY = 0;
  for (let y = 0; y < h; y++) for (let k = 0; k < 3; k++) {
    edgeX += Math.abs(px(0, y, k) - px(w - 1, y, k));
    inX += Math.abs(px(w >> 1, y, k) - px((w >> 1) - 1, y, k));
  }
  for (let x = 0; x < w; x++) for (let k = 0; k < 3; k++) {
    edgeY += Math.abs(px(x, 0, k) - px(x, h - 1, k));
    inY += Math.abs(px(x, h >> 1, k) - px(x, (h >> 1) - 1, k));
  }
  return { x: edgeX / Math.max(inX, 1), y: edgeY / Math.max(inY, 1) };
}

// Overlap blend: the last `frac` of each axis is cross-faded into the start, and the result is that much
// smaller, so its wrap-around edges match exactly.
function seamlessBlend(id, frac) {
  const { width: w, height: h, data: d } = id;
  const bx = Math.round(w * frac), by = Math.round(h * frac), W = w - bx, H = h - by;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); const out = g.createImageData(W, H); const o = out.data;
  const at = (x, y, k) => d[(y * w + x) * 4 + k];
  const fadeX = (x, y, k) => { if (x >= bx) return at(x, y, k); const a = x / bx; return at(x, y, k) * a + at(x + W, y, k) * (1 - a); };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    for (let k = 0; k < 3; k++) {
      let v = fadeX(x, y, k);
      if (y < by) { const a = y / by; v = v * a + fadeX(x, y + H, k) * (1 - a); }
      o[(y * W + x) * 4 + k] = v;
    }
    o[(y * W + x) * 4 + 3] = 255;
  }
  g.putImageData(out, 0, 0);
  return c;
}

// Average colour of the darker half of the wallpaper = its background (the leaves are the lighter half).
function wallpaperBackground(id) {
  const d = id.data, lum = [];
  for (let i = 0; i < d.length; i += 16) lum.push(d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114);
  const sorted = lum.slice().sort((a, b) => a - b), med = sorted[sorted.length >> 1];
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0, j = 0; i < d.length; i += 16, j++) if (lum[j] <= med) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  return new THREE.Color().setRGB(r / n / 255, g / n / 255, b / n / 255, THREE.SRGBColorSpace);
}

// ============================================================================
// PROCEDURAL TEXTURES
// ============================================================================
// Periodic value-noise grid so the wood tiles seamlessly in both directions.
function noiseGrid(px, py, seed) {
  const g = new Float32Array(px * py);
  for (let i = 0; i < g.length; i++) g[i] = hash32(i * 7919 + seed * 104729);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py, x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
    const a = g[y0 * px + x0], b = g[y0 * px + x1], c = g[y1 * px + x0], e = g[y1 * px + x1];
    return a + (b - a) * u + (c - a) * v + (a - b - c + e) * u * v;
  };
}

// Wood veneer, grain running along the texture's V axis.
//  'door'  : one plain-sliced walnut leaf with a cathedral figure, mapped once onto each door (1024 x 2048)
//  'frame' : dark straight-grain wood that tiles seamlessly, mapped in world space (covers 1 m x 2.4 m)
function woodTexture(kind) {
  const door = kind === 'door';
  const W = 1024, H = 2048;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); const img = g.createImageData(W, H); const d = img.data;
  const nWarpA = noiseGrid(4, 3, door ? 11 : 1), nWarpB = noiseGrid(9, 7, door ? 12 : 2), nTone = noiseGrid(5, 4, door ? 13 : 3);
  const nFine = noiseGrid(340, 5, door ? 14 : 4), nPore = noiseGrid(1000, 90, door ? 15 : 5), nFleck = noiseGrid(120, 30, door ? 16 : 6);
  const pal = door
    ? [[160, 120, 86], [124, 90, 62], [82, 58, 39]]     // medium walnut
    : [[92, 64, 45], [66, 45, 31], [42, 28, 19]];       // dark espresso
  for (let y = 0; y < H; y++) {
    const v = y / H;
    for (let x = 0; x < W; x++) {
      const u = x / W;
      const warp = (nWarpA(u * 4, v * 3) - 0.5) * 1.6 + (nWarpB(u * 9, v * 7) - 0.5) * 0.45;
      let ring;
      if (door) {
        const xc = u - 0.42 + (nWarpA(u * 4 + 1.7, v * 3) - 0.5) * 0.10;
        ring = (v * 1.1 - 3.2 * xc * xc - 0.15 * xc) * 15 + warp;   // nested, uneven arches; straight grain toward the edges
      } else {
        ring = u * 24 + warp * 1.4;                                 // straight grain, 24 lines across a metre
      }
      const t = ring - Math.floor(ring);
      const late = smooth(0.80, 0.95, t) * (1 - smooth(0.95, 1.0, t));
      const fine = nFine(u * 340, v * 5);
      const tone = nTone(u * 5, v * 4);
      let m = 0.34 + 0.26 * late + 0.38 * (fine - 0.5) + 0.28 * (tone - 0.5) + 0.10 * (t - 0.5);
      m = Math.min(1, Math.max(0, m));
      const pore = nPore(u * 1000, v * 90) > 0.8 ? 0.86 : 1.0;
      const fleck = 1 + (nFleck(u * 120, v * 30) - 0.5) * 0.08;
      const i = (y * W + x) * 4;
      for (let k = 0; k < 3; k++) {
        const base = m < 0.5 ? pal[0][k] + (pal[1][k] - pal[0][k]) * (m * 2) : pal[1][k] + (pal[2][k] - pal[1][k]) * ((m - 0.5) * 2);
        d[i + k] = Math.min(255, base * pore * fleck);
      }
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

// Brushed-brass number plate with engraved numerals.
function plateCanvas(text) {
  const W = 512, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, W, H);
  grd.addColorStop(0, '#e2c27c'); grd.addColorStop(0.45, '#b98f4a'); grd.addColorStop(1, '#d4b06a');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 900; i++) {                       // brushing
    const y = hash32(i * 3 + 1) * H, a = hash32(i * 3 + 2) * 0.08;
    g.fillStyle = hash32(i * 3 + 3) > 0.5 ? `rgba(255,240,200,${a})` : `rgba(70,45,10,${a})`;
    g.fillRect(0, y, W, 1);
  }
  g.lineWidth = 10; g.strokeStyle = 'rgba(80,52,15,0.55)'; g.strokeRect(5, 5, W - 10, H - 10);
  g.lineWidth = 3; g.strokeStyle = 'rgba(255,236,190,0.6)'; g.strokeRect(16, 16, W - 32, H - 32);
  let size = 170;
  g.font = `600 ${size}px Georgia, "Times New Roman", serif`;
  const tw = g.measureText(text).width;
  if (tw > W * 0.78) { size *= (W * 0.78) / tw; g.font = `600 ${size}px Georgia, "Times New Roman", serif`; }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(255,238,195,0.55)'; g.fillText(text, W / 2 + 2, H / 2 + 10);   // engraved edge highlight
  g.fillStyle = '#2a1b0b'; g.fillText(text, W / 2, H / 2 + 7);
  return c;
}

// ============================================================================
// GEOMETRY BUILDER  (flat-shaded quads with an optional "horizontal grain" flag)
// ============================================================================
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
class Geo {
  constructor() { this.p = []; this.n = []; this.uv = []; this.rot = []; this.idx = []; }
  // quad spanned by edge vectors u and v from o; its normal is forced to point along `hint`
  rect(o, u, v, hint, rot = 0) {
    let n = V.cross(u, v), swapped = false;
    if (V.dot(n, hint) < 0) { [u, v] = [v, u]; n = V.cross(u, v); swapped = true; }
    n = V.norm(n);
    const base = this.p.length / 3;
    for (const q of [o, V.add(o, u), V.add(V.add(o, u), v), V.add(o, v)]) { this.p.push(...q); this.n.push(...n); this.rot.push(rot); }
    // texture U always follows the caller's first edge vector, V the second
    if (swapped) this.uv.push(0, 0, 0, 1, 1, 1, 1, 0); else this.uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    this.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
  box(xa, ya, za, xb, yb, zb, rot = 0) {
    const [x0, x1] = [Math.min(xa, xb), Math.max(xa, xb)], [y0, y1] = [Math.min(ya, yb), Math.max(ya, yb)], [z0, z1] = [Math.min(za, zb), Math.max(za, zb)];
    const dx = [x1 - x0, 0, 0], dy = [0, y1 - y0, 0], dz = [0, 0, z1 - z0];
    this.rect([x1, y0, z0], dy, dz, [1, 0, 0], rot);  this.rect([x0, y0, z0], dy, dz, [-1, 0, 0], rot);
    this.rect([x0, y1, z0], dx, dz, [0, 1, 0], rot);  this.rect([x0, y0, z0], dx, dz, [0, -1, 0], rot);
    this.rect([x0, y0, z1], dx, dy, [0, 0, 1], rot);  this.rect([x0, y0, z0], dx, dy, [0, 0, -1], rot);
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setAttribute('aRot', new THREE.Float32BufferAttribute(this.rot, 1));
    g.setIndex(this.idx); g.computeBoundingSphere();
    return g;
  }
}

// ============================================================================
// LIGHTING: ceiling fixtures evaluated analytically in every surface shader.
// Each fragment lights itself from the 9 nearest fixtures along the corridor,
// so the corridor can be endless without a light pool.
// ============================================================================
const FX = {
  uFxIntensity: { value: P.fixtureIntensity },
  uFxFocus: { value: P.fixtureFocus },
  uFxColor: { value: new THREE.Color(P.fixtureColor) },
  uFxY: { value: P.height - 0.012 },
  uFxSpacing: { value: P.fixtureSpacing },
  uFxOffset: { value: P.fixtureOffset },
  uFxEps: { value: 0.12 },
  uBounce: { value: P.bounce },
  uBounceSoft: { value: 3.0 },
  uBounceColor: { value: new THREE.Color(0xffdcb0) },
  uHalo: { value: P.ceilingGlow },
};
const FX_UNIFORMS_GLSL = `
uniform float uFxIntensity, uFxFocus, uFxY, uFxSpacing, uFxOffset, uFxEps, uBounce, uBounceSoft, uHalo;
uniform vec3 uFxColor, uBounceColor;
`;
const FX_LIGHT_GLSL = `
{
  vec3 fxW = transpose(mat3(viewMatrix)) * (geometryPosition - viewMatrix[3].xyz);
  vec3 fxDown = normalize(mat3(viewMatrix) * vec3(0.0, -1.0, 0.0));
  float fxC = uFxSpacing * floor((fxW.z - uFxOffset) / uFxSpacing + 0.5) + uFxOffset;
  float fxB = 0.0;
  IncidentLight fxL;
  fxL.visible = true;
  for (int i = -4; i <= 4; i++) {
    float zf = fxC + float(i) * uFxSpacing;
    float dz = abs(zf - fxW.z);
    float win = 1.0 - smoothstep(9.0, 14.0, dz);
    vec3 pv = (viewMatrix * vec4(0.0, uFxY, zf, 1.0)).xyz;
    vec3 L = pv - geometryPosition;
    float d2 = dot(L, L);
    vec3 l = L * inversesqrt(d2);
    float ce = pow(max(dot(-l, fxDown), 0.0), uFxFocus);
    fxL.direction = l;
    fxL.color = uFxColor * (uFxIntensity * ce * win / (d2 + uFxEps));
    RE_Direct( fxL, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );
    fxB += win / (dz * dz + uBounceSoft);
  }
  irradiance += uBounceColor * (uBounce * fxB);
}
`;

// opts.tile:  vec2 metres per texture tile -> texture is mapped in world space (continuous everywhere)
// opts.edge:  GLSL run after the base colour is read, with vFxWorld available
function patch(mat, key, opts = {}) {
  const world = !!(opts.tile || opts.edge);
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, FX);
    if (opts.tile) sh.uniforms.uTile = { value: opts.tile };
    let vs = sh.vertexShader, fs = sh.fragmentShader;
    if (world) {
      vs = vs.replace('#include <common>', `#include <common>
varying vec3 vFxWorld;
${opts.tile ? 'uniform vec2 uTile;\nattribute float aRot;' : ''}`);
      vs = vs.replace('#include <project_vertex>', `#include <project_vertex>
vec4 fxWP = modelMatrix * vec4(transformed, 1.0);
vFxWorld = fxWP.xyz;
${opts.tile ? `
vec3 fxN = normalize(mat3(modelMatrix) * objectNormal);
vec2 fxUV = abs(fxN.x) > 0.5 ? fxWP.zy : (abs(fxN.y) > 0.5 ? fxWP.xz : fxWP.xy);
if (aRot > 0.5 && abs(fxN.x) > 0.5) fxUV = fxUV.yx;
fxUV /= uTile;
#ifdef USE_MAP
vMapUv = (mapTransform * vec3(fxUV, 1.0)).xy;
#endif` : ''}`);
      fs = fs.replace('#include <common>', '#include <common>\nvarying vec3 vFxWorld;');
    }
    fs = fs.replace('#include <common>', '#include <common>\n' + FX_UNIFORMS_GLSL);
    if (opts.edge) fs = fs.replace('#include <map_fragment>', '#include <map_fragment>\n' + opts.edge);
    fs = fs.replace('#include <lights_fragment_begin>', '#include <lights_fragment_begin>\n' + FX_LIGHT_GLSL);
    sh.vertexShader = vs; sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => 'hotel-' + key;
  return mat;
}

// ============================================================================
// RENDERER, SCENE, CAMERA
// ============================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = P.exposure;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(P.fogColor);
scene.fog = new THREE.Fog(P.fogColor, P.fogNear, P.fogFar);
scene.add(new THREE.HemisphereLight(0x6b5a44, 0x2a2018, P.ambient));

const camera = new THREE.PerspectiveCamera(P.fov, window.innerWidth / window.innerHeight, 0.05, P.fogFar + 20);
camera.rotation.order = 'YXZ';
camera.position.set(0, P.eye, 0);

// A tiny warm "corridor" for brass reflections only (not used to light anything else).
function brassEnvironment() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 40), new THREE.MeshBasicMaterial({ color: 0x7a6248, side: THREE.BackSide }));
  env.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(3, 40), new THREE.MeshBasicMaterial({ color: 0x0f2a28 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.45; env.add(floor);
  for (let i = -4; i <= 4; i++) {
    const lamp = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.8), new THREE.MeshBasicMaterial({ color: new THREE.Color(P.fixtureColor).multiplyScalar(4) }));
    lamp.rotation.x = Math.PI / 2; lamp.position.set(0, 1.45, i * 4); env.add(lamp);
  }
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(env, 0.02).texture; pm.dispose();
  return tex;
}

// ============================================================================
// BUILD
// ============================================================================
async function build() {
  const T = window.HOTEL_TEX;
  const [floorImg, wallImg] = await Promise.all([loadImage(T.floor), loadImage(T.wall)]);
  const floorData = imageData(floorImg), wallData = imageData(wallImg);
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  function surfaceTexture(img, data, name, fix) {
    const r = seamRatio(data);
    const src = fix === 'blend' ? seamlessBlend(data, 0.08) : img;
    const t = new THREE.Texture(src);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
    t.wrapS = t.wrapT = fix === 'mirror' ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping;
    console.log(`[hotel] ${name} texture ${data.width}x${data.height}, seam ratio x=${r.x.toFixed(2)} y=${r.y.toFixed(2)}, seam fix: ${fix}`);
    t.needsUpdate = true;
    return t;
  }
  const carpetTex = surfaceTexture(floorImg, floorData, 'carpet', P.carpetSeamFix);
  const wallTex = surfaceTexture(wallImg, wallData, 'wallpaper', P.wallSeamFix);
  const wallBg = wallpaperBackground(wallData);

  function canvasTexture(canvas, wrap) {
    const t = new THREE.CanvasTexture(canvas);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
    t.wrapS = t.wrapT = wrap;
    return t;
  }
  const doorTex = canvasTexture(woodTexture('door'), THREE.ClampToEdgeWrapping);
  const frameTex = canvasTexture(woodTexture('frame'), THREE.RepeatWrapping);

  const envTex = brassEnvironment();

  // ---------- materials ----------
  const M = {
    carpet: patch(new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 1, metalness: 0 }), 'carpet', {
      tile: new THREE.Vector2(P.carpetRepeat, P.carpetRepeat),
      edge: `{ float e = ${HALF.toFixed(3)} - abs(vFxWorld.x);
               diffuseColor.rgb *= mix(${(1 - P.edgeDark).toFixed(3)}, 1.0, smoothstep(0.0, ${P.edgeWidth.toFixed(3)}, e)); }`,
    }),
    wallpaper: patch(new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.88, metalness: 0 }), 'wall', {
      tile: new THREE.Vector2(P.wallRepeat, P.wallRepeat),
      edge: `{ float yb = vFxWorld.y - ${P.baseH.toFixed(3)};
               float yt = ${(P.height - P.crownH).toFixed(3)} - vFxWorld.y;
               diffuseColor.rgb *= mix(0.74, 1.0, smoothstep(0.0, 0.30, yb)) * mix(0.80, 1.0, smoothstep(0.0, 0.35, yt)); }`,
    }),
    door: patch(new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.42, metalness: 0 }), 'door'),
    frame: patch(new THREE.MeshStandardMaterial({ map: frameTex, roughness: 0.36, metalness: 0 }), 'frame', {
      tile: new THREE.Vector2(1.0, 2.4),
    }),
    paint: patch(new THREE.MeshStandardMaterial({ color: 0xe6e0d3, roughness: 0.9, metalness: 0 }), 'paint'),
    ceiling: patch(new THREE.MeshStandardMaterial({ color: 0xe3ddd0, roughness: 0.95, metalness: 0 }), 'ceiling', {
      // darker toward the crown molding, plus the faint glow a flush fixture throws onto the ceiling around it
      edge: `{ float e = ${HALF.toFixed(3)} - abs(vFxWorld.x);
               diffuseColor.rgb *= mix(0.78, 1.0, smoothstep(${P.crownP.toFixed(3)}, ${(P.crownP + 0.3).toFixed(3)}, e));
               float zc = uFxSpacing * floor((vFxWorld.z - uFxOffset) / uFxSpacing + 0.5) + uFxOffset;
               vec2 o = max(abs(vec2(vFxWorld.x, vFxWorld.z - zc)) - vec2(${(P.fixtureW / 2 + P.fixtureRim).toFixed(3)}, ${(P.fixtureL / 2 + P.fixtureRim).toFixed(3)}), 0.0);
               float r2 = dot(o, o);
               totalEmissiveRadiance += uFxColor * diffuseColor.rgb * uHalo * (0.6 / (1.0 + r2 * 60.0) + 0.4 / (1.0 + r2 * 6.0)); }`,
    }),
    // the rim faces away from its own light, so it carries a little of the diffuser's spill as emission
    housing: patch(new THREE.MeshStandardMaterial({ color: wallBg, emissive: wallBg, emissiveIntensity: 0.45, roughness: 0.6, metalness: 0 }), 'housing'),
    diffuser: new THREE.MeshBasicMaterial({ color: new THREE.Color(P.fixtureColor).multiplyScalar(P.diffuserGlow) }),
    brass: patch(new THREE.MeshStandardMaterial({ color: 0xc8a05c, roughness: 0.28, metalness: 1, envMap: envTex, envMapIntensity: 1.1 }), 'brass'),
  };
  const plateMats = new Map();
  function plateMaterial(num) {
    if (!plateMats.has(num)) {
      const t = new THREE.CanvasTexture(plateCanvas(String(num)));
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
      plateMats.set(num, patch(new THREE.MeshStandardMaterial({ map: t, roughness: 0.32, metalness: 0.85, envMap: envTex, envMapIntensity: 1.1 }), 'plate'));
    }
    return plateMats.get(num);
  }

  // ---------- one 12 m segment, in local coordinates z = 0 .. -segLen ----------
  // Doors every 3 m alternating sides: local z = -1.5 (left), -4.5 (right), -7.5 (left), -10.5 (right).
  const doorsPerSeg = 2 * P.segLen / P.doorPitch;
  const doorSlots = [];
  for (let i = 0; i < doorsPerSeg; i++) doorSlots.push({ z: -(P.doorPitch / 4 + i * P.doorPitch / 2), s: i % 2 === 0 ? -1 : 1 });

  const gWall = new Geo(), gWood = new Geo(), gFrame = new Geo(), gPaint = new Geo(), gFloor = new Geo(), gCeil = new Geo(), gHouse = new Geo(), gDiff = new Geo();
  const L = P.segLen, H = P.height, R = P.recess, cw = P.casingW, ct = P.casingT;
  const OUT = HALF + R + 0.2; // floor/ceiling run under the walls into the recesses

  gFloor.rect([-OUT, 0, 0], [2 * OUT, 0, 0], [0, 0, -L], [0, 1, 0]);
  gCeil.rect([-OUT, H, 0], [2 * OUT, 0, 0], [0, 0, -L], [0, -1, 0]);

  for (const s of [-1, 1]) {
    const xw = s * HALF;                         // wall plane
    const inward = [-s, 0, 0];
    const openings = doorSlots.filter(d => d.s === s).map(d => [d.z - P.doorW / 2, d.z + P.doorW / 2]).sort((a, b) => a[0] - b[0]);

    // wallpaper panels between openings, and headers above them
    let z = -L;
    for (const [za, zb] of openings) {
      gWall.rect([xw, 0, z], [0, H, 0], [0, 0, za - z], inward);
      gWall.rect([xw, P.doorH, za], [0, H - P.doorH, 0], [0, 0, zb - za], inward);
      z = zb;
    }
    gWall.rect([xw, 0, z], [0, H, 0], [0, 0, -z], inward);

    // baseboard between door casings
    let bz = -L;
    for (const [za, zb] of openings) { gFrame.box(xw, 0, bz, xw - s * P.baseT, P.baseH, za - cw, 1); bz = zb + cw; }
    gFrame.box(xw, 0, bz, xw - s * P.baseT, P.baseH, 0, 1);
    // baseboard cap bead
    bz = -L;
    for (const [za, zb] of openings) { gFrame.box(xw, P.baseH, bz, xw - s * (P.baseT * 0.55), P.baseH + 0.012, za - cw, 1); bz = zb + cw; }
    gFrame.box(xw, P.baseH, bz, xw - s * (P.baseT * 0.55), P.baseH + 0.012, 0, 1);

    for (const [za, zb] of openings) {
      const xd = s * (HALF + R);                 // door face, at the back of the recess
      // jamb lining (gives the recess its visible thickness)
      gFrame.rect([xw, 0, za], [s * R, 0, 0], [0, P.doorH, 0], [0, 0, 1]);
      gFrame.rect([xw, 0, zb], [s * R, 0, 0], [0, P.doorH, 0], [0, 0, -1]);
      gFrame.rect([xw, P.doorH, za], [s * R, 0, 0], [0, 0, zb - za], [0, -1, 0]);
      // casing around the opening, standing proud of the wall
      gFrame.box(xw, 0, za - cw, xw - s * ct, P.doorH + cw, za);
      gFrame.box(xw, 0, zb, xw - s * ct, P.doorH + cw, zb + cw);
      gFrame.box(xw, P.doorH, za - cw, xw - s * ct, P.doorH + cw, zb + cw, 1);
      // door stop around the slab
      const st = 0.014, sp = 0.012;
      gFrame.box(xd, 0, za, xd - s * sp, P.doorH, za + st);
      gFrame.box(xd, 0, zb - st, xd - s * sp, P.doorH, zb);
      gFrame.box(xd, P.doorH - st, za, xd - s * sp, P.doorH, zb, 1);
      // door slab face: one veneer leaf stretched across the whole door
      gWood.rect([xd, 0, za], [0, 0, zb - za], [0, P.doorH, 0], inward);
    }

    // crown molding: a cove profile swept along the segment
    const prof = [[0, P.crownH], [0.010, P.crownH], [0.010, P.crownH - 0.010], [0.016, P.crownH - 0.014]];
    for (let i = 0; i <= 8; i++) {                 // quarter-round cove
      const a = (i / 8) * Math.PI / 2;
      prof.push([0.016 + (P.crownP - 0.026) * (1 - Math.cos(a)), (P.crownH - 0.014) - (P.crownH - 0.024) * Math.sin(a)]);
    }
    prof.push([P.crownP - 0.010, 0.010], [P.crownP, 0.010], [P.crownP, 0]);
    for (let i = 0; i < prof.length - 1; i++) {
      const [i0, d0] = prof[i], [i1, d1] = prof[i + 1];
      const p0 = [xw - s * i0, H - d0, 0], p1 = [xw - s * i1, H - d1, 0];
      gPaint.rect(p0, [0, 0, -L], [p1[0] - p0[0], p1[1] - p0[1], 0], [-s, -1, 0]);
    }
  }

  // flush rectangular ceiling fixtures: housing in the wallpaper's background colour, glowing diffuser
  for (let zf = -P.fixtureOffset; zf > -L; zf -= P.fixtureSpacing) {
    const hw = P.fixtureW / 2 + P.fixtureRim, hl = P.fixtureL / 2 + P.fixtureRim;
    gHouse.box(-hw, H - 0.008, zf - hl, hw, H, zf + hl);
    gDiff.rect([-P.fixtureW / 2, H - 0.0085, zf + P.fixtureL / 2], [P.fixtureW, 0, 0], [0, 0, -P.fixtureL], [0, -1, 0]);
  }

  const G = {
    wall: gWall.build(), door: gWood.build(), frame: gFrame.build(), paint: gPaint.build(),
    floor: gFloor.build(), ceil: gCeil.build(), house: gHouse.build(), diff: gDiff.build(),
  };

  // door knob (lathe profile: rose, neck, knob), axis along +Y before rotation
  const knobProfile = [[0, 0], [0.031, 0], [0.031, 0.004], [0.027, 0.009], [0.011, 0.011], [0.0085, 0.02], [0.0085, 0.038],
    [0.014, 0.045], [0.024, 0.053], [0.029, 0.063], [0.028, 0.074], [0.022, 0.083], [0.012, 0.088], [0, 0.0895]].map(([r, h]) => new THREE.Vector2(r, h));
  const knobGeo = new THREE.LatheGeometry(knobProfile, 40);
  const plateGeo = new THREE.BoxGeometry(P.plateW, P.plateH, 0.006);

  // ---------- segment pool (recycled as you walk, so the corridor never ends) ----------
  const fogSegs = Math.ceil((P.fogFar + L) / L);
  const POOL = 2 * fogSegs + 1;
  const pool = [];
  for (let i = 0; i < POOL; i++) {
    const grp = new THREE.Group();
    grp.add(new THREE.Mesh(G.floor, M.carpet), new THREE.Mesh(G.ceil, M.ceiling), new THREE.Mesh(G.wall, M.wallpaper),
      new THREE.Mesh(G.door, M.door), new THREE.Mesh(G.frame, M.frame), new THREE.Mesh(G.paint, M.paint),
      new THREE.Mesh(G.house, M.housing), new THREE.Mesh(G.diff, M.diffuser));
    const plates = [];
    for (const d of doorSlots) {
      const s = d.s, za = d.z - P.doorW / 2, zb = d.z + P.doorW / 2;
      const latch = s < 0 ? za : zb, dir = s < 0 ? 1 : -1;          // dir points from the latch edge into the door
      const knob = new THREE.Mesh(knobGeo, M.brass);
      knob.rotation.z = s * Math.PI / 2;                                // lathe axis -> pointing out of the door
      knob.position.set(s * (HALF + R), P.knobY, latch + dir * 0.068);
      const plate = new THREE.Mesh(plateGeo, M.brass);
      plate.rotation.y = -s * Math.PI / 2;
      plate.position.set(s * (HALF - 0.003), P.plateY, latch - dir * (cw + 0.035 + P.plateW / 2));
      grp.add(knob, plate); plates.push(plate);
    }
    scene.add(grp);
    pool.push({ grp, plates, k: null });
  }

  // door index d counts doors from the spawn point: d = 0 is the first door ahead (z = -1.5), negative d are behind
  function doorNumber(d) {
    if (d >= 0 && d < NAMED_DOORS.length) return NAMED_DOORS[d];
    const r = hash32(d * 31 + 7), q = hash32(d * 131 + 3);
    let n;
    if (r < 0.12) n = 1 + Math.floor(q * 99);
    else if (r < 0.62) n = 100 + Math.floor(q * 900);
    else n = 1000 + Math.floor(q * 1100);
    return NAMED_DOORS.includes(n) ? n + 1 : n;
  }

  function updatePool() {
    const kc = Math.floor(-camera.position.z / L);
    for (let k = kc - fogSegs; k <= kc + fogSegs; k++) {
      const slot = pool[((k % POOL) + POOL) % POOL];
      if (slot.k === k) continue;
      slot.k = k;
      slot.grp.position.z = -k * L;
      slot.plates.forEach((pl, i) => { pl.material = plateMaterial(doorNumber(k * doorsPerSeg + i)); });
    }
  }

  return { updatePool, M, doorNumber };
}

// ============================================================================
// CONTROLS
// ============================================================================
const keys = new Set();
let yaw = 0, pitch = 0;
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle('hidden', locked);
  if (!locked) keys.clear();
});
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * P.mouseSens;
  pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * P.mouseSens));
});
addEventListener('keydown', (e) => keys.add(e.code));
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const vel = new THREE.Vector2();
function move(dt) {
  const f = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const r = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? P.fastSpeed : P.walkSpeed;
  let tx = 0, tz = 0;
  if (f || r) {
    const l = Math.hypot(f, r);
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    tx = (-sy * f + cy * r) / l * speed; tz = (-cy * f - sy * r) / l * speed;
  }
  const k = 1 - Math.exp(-dt * 9);          // gentle acceleration so starts and stops aren't instant
  vel.x += (tx - vel.x) * k; vel.y += (tz - vel.y) * k;
  camera.position.x = Math.max(-(HALF - 0.3), Math.min(HALF - 0.3, camera.position.x + vel.x * dt));
  camera.position.z += vel.y * dt;
  camera.rotation.set(pitch, yaw, 0);
}

// ============================================================================
// GO
// ============================================================================
const world = await build();
statusEl.textContent = 'Ready';
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  move(dt);
  world.updatePool();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

// test / tuning hook
window.__hotel = {
  P, FX, renderer, scene, camera, world,
  setPose(x, z, yawDeg = 0, pitchDeg = 0) { camera.position.set(x, P.eye, z); yaw = yawDeg * Math.PI / 180; pitch = pitchDeg * Math.PI / 180; camera.rotation.set(pitch, yaw, 0); vel.set(0, 0); },
};
